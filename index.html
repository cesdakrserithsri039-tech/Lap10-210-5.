<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Navigation</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #0b0712;
            color: #e9d5ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .banner-container {
            width: 100%;
            height: 200px;
            overflow: hidden;
            background-color: #12091f;
            border-bottom: 2px solid #3b0764;
        }

        .banner-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .marquee-box {
            background: linear-gradient(90deg, #170d29, #2e1065, #170d29);
            color: #f0abfc;
            padding: 8px 0;
            font-weight: 500;
            border-bottom: 1px solid #581c87;
            text-shadow: 0 0 8px rgba(240, 171, 252, 0.4);
        }
        .nav-container {
            background-color: #12091f;
            padding: 12px 15px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            border-bottom: 2px solid #3b0764;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        a {
            display: inline-block;
            background: #1f1138;
            color: #d8b4fe;
            text-decoration: none;
            border: 1px solid #581c87;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        a:hover {
            background: linear-gradient(135deg, #7e22ce, #a855f7);
            color: #ffffff;
            border-color: #c084fc;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
            transform: translateY(-2px);
        }
        a:active {
            transform: translateY(0);
        }
        .iframe-container {
            flex-grow: 1;
            width: 100%;
            background-color: #0b0712;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="banner-container">
        <img src="banner.png" alt="Banner">
    </div>
    <div class="marquee-box">
        <marquee behavior="scroll" direction="left" scrollamount="6">
            สาขาวิศวกรรมคอมพิวเตอร์ คณะวิศวกรรมศาสตร์ มหาวิทยาลัยเทคโนโลยีราชมงคลพระนคร
        </marquee>
    </div>
    <div class="nav-container">
        <a href="Aboutme2.html" target="frame2">Home</a>
        <a href="Aboutme.html" target="frame2">AboutMe</a>
        <a href="myport.html" target="frame2">PortFolio</a>
        <a href="gallery.html" target="frame2">Gallery</a>
        <a href="school.html" target="frame2">Myschools</a>
        <a href="my f.html" target="frame2">My f</a>
        <a href="Lap7.html" target="frame2">class</a>
        <a href="Lap8.html" target="frame2">Bar Graph</a>
        <a href="google-form.html" target="frame2">Google Form</a>
    </div>

    <div class="iframe-container">
        <iframe name="frame2" src="LAP2/Aboutme2.html"></iframe>
    </div>

</body>
</html>
