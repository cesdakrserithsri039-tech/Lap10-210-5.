<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบสอบถามนักศึกษาใหม่ 2568</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #0b0712;
            color: #e9d5ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card {
            background-color: #150c26;
            border: 1px solid #3b0764 !important;
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.2);
            border-radius: 20px;
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #2e1065, #581c87) !important;
            border-bottom: 1px solid #7e22ce !important;
        }

        .card-header h1 {
            color: #f0abfc;
            text-shadow: 0 0 10px rgba(240, 171, 252, 0.3);
        }

        .card-body {
            padding: 2rem;
        }

        h5 {
            color: #c084fc;
        }

        .form-label {
            color: #d8b4fe;
            font-weight: 500;
        }

        /* ปรับแต่งช่องกรอกข้อมูล (Input & Select) */
        .form-control, .form-select {
            background-color: #1f1138;
            border: 1px solid #581c87;
            color: #f3e8ff;
            border-radius: 10px;
        }

        .form-control:focus, .form-select:focus {
            background-color: #261545;
            color: #ffffff;
            border-color: #a855f7;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.5);
        }

        .form-control::placeholder {
            color: #7e22ce;
        }

        /* ปรับแต่ง Checkbox และ Radio Button */
        .form-check-input {
            background-color: #1f1138;
            border-color: #7e22ce;
        }

        .form-check-input:checked {
            background-color: #a855f7;
            border-color: #c084fc;
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.6);
        }

        .form-check-label {
            color: #e9d5ff;
        }

        /* เส้นแบ่งส่วน */
        hr {
            border-color: #581c87;
            opacity: 0.6;
        }

        /* ปุ่มกด */
        .btn-primary {
            background: linear-gradient(135deg, #7e22ce, #a855f7);
            border: none;
            color: #ffffff;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #9333ea, #c084fc);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: #2e1065;
            border: 1px solid #581c87;
            color: #d8b4fe;
            font-weight: 500;
            padding: 10px 24px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background-color: #3b0764;
            color: #ffffff;
            border-color: #7e22ce;
        }

        /* ส่วนท้าย Card */
        .card-footer {
            background-color: #0f071c !important;
            color: #a855f7 !important;
            border-top: 1px solid #2e1065 !important;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container my-5">
        <div class="card shadow-lg border-0">
            <div class="card-header p-4">
                <h1 class="h3 mb-0 text-center fw-bold">แบบสอบถามนักศึกษาใหม่ 2568</h1>
            </div>

            <div class="card-body p-4">
                <form action="confirmed.html" method="post">
                    <h5 class="fw-bold mb-3">นักศึกษา กรอกข้อมูลส่วนตัว</h5>
                    <div class="mb-3">
                        <label for="username" class="form-label">ชื่อนักศึกษา:</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="ระบุชื่อ-นามสกุล" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">รหัสประจำตัว:</label>
                        <input type="text" class="form-control" id="password" name="password" placeholder="ระบุรหัสนักศึกษา" required>
                    </div>
                    <div class="mb-4">
                        <label for="yearold" class="form-label">ปีที่เข้าศึกษา:</label>
                        <input type="text" class="form-control" id="yearold" name="yearold" value="2568" required>
                    </div>

                    <hr class="my-4">

                    <h5 class="fw-bold mb-3">นักศึกษาชอบเกมอะไร (เลือกได้หลายอย่าง)</h5>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" name="game1" value="Roblox" id="game1">
                        <label class="form-check-label" for="game1">Roblox</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" name="game2" value="VALORANT" id="game2">
                        <label class="form-check-label" for="game2">VALORANT</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" name="game3" value="Minecraft" id="game3">
                        <label class="form-check-label" for="game3">Minecraft</label>
                    </div>
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" name="game4" value="ROV" id="game4">
                        <label class="form-check-label" for="game4">ROV</label>
                    </div>

                    <hr class="my-4">

                    <h5 class="fw-bold mb-3">นักศึกษา ชอบสตีมเมอร์คนไหนที่สุด</h5>
                    <div class="mb-4">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="fav_streamer" id="kritngi" value="KritNgiChannel">
                            <label class="form-check-label" for="kritngi">KritNgiChannel</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="fav_streamer" id="guyngid" value="guyngid">
                            <label class="form-check-label" for="guyngid">guyngid</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="fav_streamer" id="ananped" value="Ananped">
                            <label class="form-check-label" for="ananped">Ananped</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="fav_streamer" id="primkung" value="PRIMKUNG">
                            <label class="form-check-label" for="primkung">PRIMKUNG</label>
                        </div>
                    </div>

                    <hr class="my-4">

                    <h5 class="fw-bold mb-3">นักศึกษา ชอบอนิเมะเรื่องไหนมากที่สุด</h5>
                    <div class="mb-4">
                        <label for="anime" class="form-label">กรุณาคลิกเพื่อเลือก เพียงอย่างเดียว:</label>
                        <select class="form-select" name="anime" id="anime">
                            <option value="One Piece">One Piece</option>
                            <option value="Naruto">Naruto</option>
                            <option value="Solo Leveling">Solo Leveling</option>
                            <option value="Sword Art Online">Sword Art Online</option>
                            <option value="The Eminence in Shadow">The Eminence in Shadow</option>
                        </select>
                    </div>

                    <div class="pt-2 text-center text-md-start">
                        <input type="submit" class="btn btn-primary me-2" value="ส่งคำตอบ">
                        <input type="reset" class="btn btn-secondary" value="กรอกใหม่">
                    </div>
                </form>
            </div>

            <div class="card-footer text-center py-3">
                สงวนลิขสิทธิ์โดย นายเจษฎากร เสริฐศรี รหัสนักศึกษา 056950405210-5 RMUTP-CPE
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
