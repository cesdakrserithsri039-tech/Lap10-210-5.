<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY F1 Gallery</title>
    <style>
        body {
            background-color: #0d0714;
            color: #e9d5ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            text-align: center;
        }

        h1 {
            width: fit-content;
            margin: 0 auto 30px auto;
            padding: 12px 40px;
            color: #f0abfc;
            background: linear-gradient(135deg, #2e1065, #581c87);
            border: 2px solid #a855f7;
            border-radius: 25px;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
            letter-spacing: 2px;
            font-size: 2.2rem;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 20px;
            margin: 0 auto;
        }

        td {
            background-color: #190e2e;
            border: 1px solid #3b0764;
            border-radius: 15px;
            padding: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        /* เอฟเฟกต์เวลานำเมาส์ไปชี้ที่การ์ดรูปภาพ */
        td:hover {
            transform: translateY(-8px);
            border-color: #a855f7;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.5);
            background-color: #241442;
        }

        td a {
            text-decoration: none;
            color: #d8b4fe;
            font-weight: 600;
            font-size: 1.1rem;
            display: block;
        }

        td a:hover {
            color: #f472b6;
        }

        img {
            width: 100%;
            max-width: 320px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 1px solid #581c87;
        }

        hr {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, #a855f7, transparent);
            margin: 40px 0 20px 0;
        }

        .footer {
            color: #a855f7;
            font-size: 0.95rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MY F1 Gallery</h1>
        
        <table>
            <tr>
                <td>
                    <a href="max-verstappen-red-bull-2026-chinese-gp-scaled">
                        <img src="max-verstappen-red-bull-2026-chinese-gp-scaled" alt="Red Bull"><br>Red Bull
                    </a>
                </td>
                <td>
                    <a href="F1 Mesidas.jpg">
                        <img src="F1 Mesidas.jpg" alt="F1 Mercedes"><br>F1 Mercedes
                    </a>
                </td>    
                <td>
                    <a href="oscar-piastri-mclaren.jpg">
                        <img src="oscar-piastri-mclaren.jpg" alt="F1 McLaren"><br>F1 McLaren
                    </a>
                </td> 
                <td>
                    <a href="charles-leclerc-australia-fp1_f.webp">
                        <img src="charles-leclerc-australia-fp1_f.webp" alt="F1 Ferrari"><br>F1 Ferrari
                    </a>
                </td>
            </tr>
            <tr>
                <td>
                    <a href="williams_auto_6_be1b3b0d-f31b-4b26-8cf9-52d8d4a873eb.webp">
                        <img src="williams_auto_6_be1b3b0d-f31b-4b26-8cf9-52d8d4a873eb.webp" alt="F1 Williams"><br>F1 Williams
                    </a>
                </td>
                <td>
                    <a href="F1 audi.jpg">
                        <img src="F1 audi.jpg" alt="F1 Audi"><br>F1 Audi
                    </a>
                </td>
                <td>
                    <a href="f1 cadillac.jpg">
                        <img src="f1 cadillac.jpg" alt="F1 Cadillac"><br>F1 Cadillac
                    </a>
                </td>
                <td>
                    <a href="F1 Alpine.jpg">
                        <img src="F1 Alpine.jpg" alt="F1 Alpine"><br>F1 Alpine
                    </a>
                </td>
            </tr>
        </table>

        <hr>

        <div class="footer">
            CopyRight By 210-5 นายเจษฎากร เสริฐศรี<br>
            สาขาวิศวกรรมคอมพิวเตอร์ คณะวิศวกรรมศาสตร์<br>
            มหาวิทยาลัยเทคโนโลยีราชมงคลพระนคร
        </div>
    </div>

</body>
</html>
