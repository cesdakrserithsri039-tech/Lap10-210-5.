<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
        body {
            background-color: #0f0a15;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 380px;
            margin: 40px auto;
            text-align: center;
            border: 1px solid #3b1d5a;
            border-radius: 20px;
            padding: 30px 25px;
            background-color: #160d27;
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.2);
        }

        img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border: 3px solid #a855f7;
            border-radius: 50%;
            background-color: #24143d;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            margin: 15px 0;
        }

        h1 {
            background-color: #24143d;
            color: #c084fc;
            border: 1px solid #7e22ce;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 1.2rem;
            margin: 10px 0;
        }

        h2 {
            color: #d8b4fe;
            font-size: 1rem;
            font-weight: 400;
            margin: 6px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ID-056950405210-5</h1>
        <img src="Screenshot 2026-07-09 141742.png" alt="Profile Image">
        <h1>นายเจษฎากร เสริฐศรี</h1>
        <h2>สาขาวิศวกรรมคอมพิวเตอร์</h2>
        <h2>คณะวิศวกรรมศาสตร์</h2>
        <h2>มหาวิทยาลัยเทคโนโลยีราชมงคลพระนคร</h2>
    </div>

</body>
</html>
